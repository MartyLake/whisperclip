# XcodeGen spec: opens WhisperClip in Xcode as a macOS app target instead of a Swift package.
#
# Generate with ./xcode_gen.sh (it sets the env vars used below and pins package versions).
# The project is written to Xcode/ — not the repo root — so that `xcodebuild -scheme WhisperClip`
# in local_build.sh / build.sh keeps resolving to Package.swift.
#
# Package.swift stays the source of truth for `swift test`, local_build.sh and release builds.
# Keep the `packages` section below in sync with Package.swift when dependencies change.

name: WhisperClip

options:
  bundleIdPrefix: com
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.1
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    exactVersion: 3.32.3
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.32.3
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.17.7
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    exactVersion: 1.1.9
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 2.4.0

targets:
  WhisperClip:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: WhisperClip.icns
        buildPhase: resources
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-transformers
        product: Hub
      - package: swift-transformers
        product: Tokenizers
      - package: mlx-swift
        product: MLX
      - package: FluidAudio
        product: FluidAudio
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
    info:
      path: Xcode/Info.plist
      properties:
        CFBundleName: WhisperClip
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: WhisperClip
        LSMinimumSystemVersion: "14.0"
        LSArchitecturePriority: [arm64]
        LSRequiresNativeExecution: true
        NSMicrophoneUsageDescription: WhisperClip needs access to your microphone for transcription.
        NSPasteboardUsageDescription: WhisperClip needs clipboard access to paste transcribed text.
        NSAccessibilityUsageDescription: WhisperClip needs accessibility permissions for global hotkeys.
        NSAppleEventsUsageDescription: WhisperClip needs permission to control System Events for clipboard operations.
        NSHumanReadableCopyright: © 2025 Cydanix LLC. All rights reserved.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSExceptionDomains:
            huggingface.co:
              NSExceptionAllowsInsecureHTTPLoads: false
              NSIncludesSubdomains: true
            hf.space:
              NSExceptionAllowsInsecureHTTPLoads: false
              NSIncludesSubdomains: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whisperclip
        PRODUCT_NAME: WhisperClip
        MARKETING_VERSION: ${WHISPERCLIP_VERSION}
        CURRENT_PROJECT_VERSION: ${WHISPERCLIP_VERSION}
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: WhisperClip.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ${WHISPERCLIP_CODE_SIGN_IDENTITY}
        DEVELOPMENT_TEAM: ${WHISPERCLIP_TEAM_ID}
    scheme:
      environmentVariables:
        LOCAL_RUN: "1"
        LOG_TO_CONSOLE: "1"
